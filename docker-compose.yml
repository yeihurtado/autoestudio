  services:
    sut:
      build: ./sut
      container_name: k6-sut
      ports:
        - "8000:8000"
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if
  urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)\""]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 5s
      networks:
        - k6net

    prometheus:
      image: prom/prometheus:v2.54.1
      container_name: k6-prometheus
      ports:
        - "9090:9090"
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--web.enable-remote-write-receiver'
        - '--enable-feature=native-histograms'
        - '--storage.tsdb.retention.time=7d'
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus-data:/prometheus
      restart: unless-stopped
      networks:
        - k6net

    grafana:
      image: grafana/grafana:10.4.2
      container_name: k6-grafana
      ports:
        - "3000:3000"
      environment:
        - GF_AUTH_ANONYMOUS_ENABLED=true
        - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        - GF_AUTH_BASIC_ENABLED=false
        - GF_USERS_DEFAULT_THEME=dark
      volumes:
        - grafana-data:/var/lib/grafana
        - ./grafana/provisioning:/etc/grafana/provisioning:ro
        - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      depends_on:
        - prometheus
      restart: unless-stopped
      networks:
        - k6net

  networks:
    k6net:
      driver: bridge

  volumes:
    prometheus-data:
    grafana-data: